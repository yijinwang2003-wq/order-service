apiVersion: v1
kind: Service
metadata:
  name: order-service-clusterip
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: order-service-nodeport
spec:
  type: NodePort
  selector:
    app: order-service
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30081